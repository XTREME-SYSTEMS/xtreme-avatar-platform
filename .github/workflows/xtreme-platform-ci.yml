name: Xtreme Avatar CI
on:
  push:
    branches: [main, "feature/**", "bootstrap/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xtreme-platform-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Durable loop contracts
        run: node --test tests/xtreme-v3-loop-contract.test.mjs
  browser:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Mobile and UI acceptance
        run: python tests/test_xtreme_v3_fidelity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xtreme-avatar-ui-evidence
          path: artifacts/xtreme-v3/
          if-no-files-found: warn
          retention-days: 7
